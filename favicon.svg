<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <!-- 硃紅圓角底 -->
  <rect width="64" height="64" rx="8" ry="8" fill="#c1272d"/>
  <!-- 雙線印章內框(放大版才看得到,小尺寸會合併成單一邊緣) -->
  <rect x="4" y="4" width="56" height="56" rx="5" ry="5" fill="none" stroke="#faf6ef" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="7" y="7" width="50" height="50" rx="3" ry="3" fill="none" stroke="#8b1a1f" stroke-width="0.8"/>
  <!-- 「語」字白色置中(用通用 serif fallback,確保各平台都能渲染) -->
  <text x="32" y="48" font-family="'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif"
        font-size="42" font-weight="900" fill="#faf6ef" text-anchor="middle"
        letter-spacing="0">語</text>
</svg>
