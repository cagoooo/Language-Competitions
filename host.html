<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>主持人提詞 ｜ 2026 桃園市語文競賽龍潭區複賽</title>
<meta name="description" content="競賽組長手機提詞器：開啟你的場次,黑底白字大字呈現,可全螢幕、自動捲動,告別紙本。">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<!-- 字型:系統中文字型,零外部請求 -->

<!-- Tailwind:本地預編譯版 -->
<link rel="stylesheet" href="tailwind.min.css">
<script src="host-scripts.js"></script>
<script src="events.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

<style>
  html, body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', 'Noto Sans CJK TC', system-ui, sans-serif;
    height: 100%;
    overscroll-behavior: contain;
  }
  body {
    /* 安全區域(iPhone 瀏海/底部 home bar) */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* 主稿閱讀區的捲動條柔化 */
  .reader::-webkit-scrollbar { width: 8px; }
  .reader::-webkit-scrollbar-track { background: transparent; }
  .reader::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* 段落 hover 高亮 */
  .part-block { transition: all 0.2s; border-left: 3px solid transparent; }
  .part-block.current { border-left-color: #c1272d; background: rgba(193, 39, 45, 0.08); }
  .part-block:hover { background: rgba(255, 255, 255, 0.03); }

  /* 顯示模式樣式 */
  body.theme-light { background: #fefefe; color: #1a1a1a; }
  body.theme-light .reader::-webkit-scrollbar-thumb { background: #ccc; }
  body.theme-light .part-block.current { background: rgba(193,39,45,0.06); }

  body.theme-amber { background: #1c1408; color: #f4d68a; }
  body.theme-amber .part-block.current { background: rgba(244, 214, 138, 0.08); border-left-color: #f4d68a; }

  /* 列印優化 */
  @media print {
    body { background: white !important; color: black !important; }
    .no-print { display: none !important; }
    .reader { overflow: visible !important; height: auto !important; }
  }

  /* 字級 CSS 變數 */
  .reader { font-size: var(--reader-size, 22px); line-height: 1.85; letter-spacing: 0.02em; }

  /* 全螢幕時隱藏滾動條(視覺乾淨) */
  :fullscreen .no-print-fullscreen { opacity: 0.3; transition: opacity 0.3s; }
  :fullscreen .no-print-fullscreen:hover { opacity: 1; }

  [x-cloak] { display: none !important; }

  /* sr-only:螢幕閱讀器專用,視覺隱藏(自訂以防 Tailwind purge) */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* ─────────────── RWD:手機優化 ─────────────── */
  @media (max-width: 640px) {
    /* 工具列改兩行排版:第一行 返回 + 場次選 / 第二行 控制按鈕橫排 */
    .topbar-inner {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 6px !important;
      padding: 8px 10px !important;
    }
    .topbar-row {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }
    .topbar-row-controls {
      justify-content: space-between;
    }
    /* 控制按鈕在手機統一 min-h-44px 觸控友善 */
    .topbar-row-controls > button {
      min-height: 44px !important;
      flex: 1 1 0 !important;
      max-width: none !important;
    }
    .topbar-row-controls > button[data-toggle="auto-scroll"] {
      flex: 2 1 0 !important; /* 自動捲動按鈕多一點寬度容納文字 */
    }
    /* 場次下拉框加高 */
    select#scene-select { min-height: 44px !important; font-size: 14px !important; }
    /* 返回主頁按鈕加大 */
    a[data-link="home"] { min-height: 44px; }

    /* 主稿閱讀區手機更舒適 */
    .reader { padding: 16px 14px 100px !important; }
    .reader article > div:first-child h1 { font-size: 22px !important; line-height: 1.3; }
    /* SEG 標題在手機加大 */
    .part-block h2 {
      font-size: 16px !important;
      flex-wrap: wrap;
    }
    .part-block .seg-tag {
      font-size: 11px !important;
      padding: 3px 8px !important;
    }
    /* 段落內容預設較大字 */
    .part-block .part-body { font-size: 17px; }

    /* 底部分段跳轉:按鈕加大,加 safe-area */
    .bottom-nav {
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 10px !important;
    }
    .bottom-nav button {
      min-height: 48px !important;
      font-size: 14px !important;
      max-width: none !important;
      flex: 1 1 0 !important;
    }
    .bottom-nav .progress-indicator {
      font-size: 13px !important;
      min-width: 50px;
      text-align: center;
    }
  }

  /* 極小螢幕(< 380px):再進一步縮 */
  @media (max-width: 380px) {
    .topbar-row-controls > button { font-size: 11px !important; }
    .reader { padding: 12px 10px 100px !important; }
    .part-block .part-body { font-size: 16px; }
  }
</style>
</head>
<body x-data="prompter()" x-init="init()" :class="theme === 'light' ? 'theme-light' : theme === 'amber' ? 'theme-amber' : ''" x-cloak>

<!-- 頂部工具列(RWD:桌機單行,手機兩行排版) -->
<header class="no-print sticky top-0 z-30 bg-black/85 backdrop-blur border-b border-white/10" :class="theme==='light' && 'bg-white/95 border-black/10'">
  <div class="topbar-inner max-w-5xl mx-auto px-3 sm:px-5 py-2 flex items-center justify-between gap-2 flex-wrap">
    <!-- 左區:返回 + 場次選擇 -->
    <div class="topbar-row flex items-center gap-2 flex-1 min-w-0">
      <a href="index.html" data-link="home" class="shrink-0 flex items-center gap-1 px-3 py-2 rounded-sm text-xs sm:text-sm font-bold border border-current opacity-80 hover:opacity-100" title="回主頁">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>主頁</span>
      </a>
      <label for="scene-select" class="sr-only">選擇場次</label>
      <select id="scene-select" x-model="currentSceneNo" @change="resetView()" class="flex-1 min-w-0 max-w-md px-2 py-2 rounded-sm bg-white/10 border border-white/20 text-white text-sm font-bold focus:outline-none focus:border-amber-300" :class="theme==='light' ? '!bg-black/5 !text-black !border-black/20' : theme==='amber' ? '!bg-amber-100/10 !text-amber-200 !border-amber-300/30' : ''">
        <template x-for="s in scripts" :key="s.no">
          <option :value="s.no" class="text-black" x-text="'第 ' + s.no + ' 場 ・ ' + s.title"></option>
        </template>
      </select>
    </div>

    <!-- 右區:控制按鈕(手機自動換行成第二行) -->
    <div class="topbar-row topbar-row-controls flex items-center gap-1.5">
      <!-- 字級小 -->
      <button @click="adjustSize(-2)" class="w-10 h-10 flex items-center justify-center rounded-sm border border-current opacity-70 hover:opacity-100 active:scale-95 text-base font-bold" title="字體縮小" aria-label="字體縮小">A−</button>
      <!-- 字級大 -->
      <button @click="adjustSize(+2)" class="w-10 h-10 flex items-center justify-center rounded-sm border border-current opacity-70 hover:opacity-100 active:scale-95 text-base font-bold" title="字體放大" aria-label="字體放大">A+</button>
      <!-- 主題切換 -->
      <button @click="cycleTheme()" class="w-10 h-10 flex items-center justify-center rounded-sm border border-current opacity-70 hover:opacity-100 active:scale-95" :title="'主題:' + theme" aria-label="切換主題">
        <svg x-show="theme==='dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg x-show="theme==='light'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg x-show="theme==='amber'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
      </button>
      <!-- 自動捲動(較寬,容納文字) -->
      <button @click="toggleAutoScroll()" data-toggle="auto-scroll"
              :class="autoScroll ? 'bg-[#c1272d] text-white border-[#c1272d]' : 'border-current opacity-70 hover:opacity-100'"
              class="px-3 h-10 rounded-sm border text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 active:scale-95" title="自動捲動">
        <svg x-show="!autoScroll" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg x-show="autoScroll" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span x-text="autoScroll ? '播放中' : '播放'"></span>
      </button>
      <!-- 全螢幕 -->
      <button @click="toggleFullscreen()" class="w-10 h-10 flex items-center justify-center rounded-sm border border-current opacity-70 hover:opacity-100 active:scale-95" title="全螢幕" aria-label="切換全螢幕">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- 主稿閱讀區 -->
<main class="reader px-4 sm:px-8 md:px-12 py-6 pb-32" id="reader-main">
  <template x-if="currentScene">
    <article class="max-w-3xl mx-auto">
      <!-- 場次標題 -->
      <div class="mb-8 pb-5 border-b border-white/10" :class="theme==='light' && 'border-black/10'">
        <div class="text-xs sm:text-sm tracking-[0.3em] opacity-60 mb-2">第 <span x-text="currentScene.no"></span> 場</div>
        <h1 class="font-serif-tc text-2xl sm:text-3xl md:text-4xl font-black leading-tight" x-text="currentScene.title"></h1>
        <p class="text-xs sm:text-sm opacity-60 mt-2">
          2026 / 5 / 23(六) ・ 桃園市石門國民小學
          <span class="mx-2">|</span>
          來源：競賽主持文稿
        </p>
      </div>

      <!-- 段落清單 -->
      <div class="space-y-6">
        <template x-for="(part, idx) in currentScene.parts" :key="idx">
          <section class="part-block pl-4 sm:pl-6 py-3" :class="idx === currentPartIdx && 'current'" :data-idx="idx">
            <h2 class="font-serif-tc text-base sm:text-lg font-bold mb-3 flex items-center gap-2 flex-wrap">
              <span class="seg-tag inline-block px-2 py-0.5 bg-[#c1272d] text-white text-[10px] font-bold rounded-sm tracking-wider whitespace-nowrap">SEG <span x-text="idx + 1"></span></span>
              <span x-text="part.header"></span>
            </h2>
            <div class="part-body whitespace-pre-wrap leading-relaxed" x-html="formatText(part.text)"></div>
          </section>
        </template>
      </div>

      <!-- 結尾 -->
      <div class="mt-12 pt-6 border-t border-white/10 text-center text-xs opacity-50" :class="theme==='light' && 'border-black/10'">
        — 第 <span x-text="currentScene.no"></span> 場主持稿結束 —
        <div class="mt-2">
          桃園市 115 年語文競賽龍潭區複賽 ・
          <a href="index.html" class="underline hover:text-amber-300">回主頁</a>
        </div>
      </div>
    </article>
  </template>

  <template x-if="!currentScene">
    <div class="text-center py-20 opacity-60">
      <div class="text-5xl mb-4">📜</div>
      <p>請從上方選擇場次</p>
    </div>
  </template>
</main>

<!-- 浮動計時 + 鈴聲面板(給計時組使用) -->
<div class="no-print fixed z-40" style="bottom: calc(80px + env(safe-area-inset-bottom)); right: 12px;"
     x-data="bellTimer()" x-init="init()">
  <!-- 收起時:圓形按鈕 -->
  <button x-show="!expanded" @click="expanded = true"
          class="w-14 h-14 bg-amber-500 hover:bg-amber-400 text-black rounded-full shadow-2xl flex items-center justify-center text-2xl active:scale-95"
          title="開啟計時 + 鈴聲" aria-label="開啟計時與鈴聲面板">
    🔔
  </button>
  <!-- 展開時:面板 -->
  <div x-show="expanded" x-transition
       class="bg-gray-900/95 border border-amber-500/40 rounded-lg p-4 shadow-2xl w-72 text-white"
       :class="theme==='light' && '!bg-white !border-amber-600/40 !text-black'">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-bold text-amber-400">⏱ 計時 + 🔔 鈴聲</h3>
      <button @click="expanded = false" class="text-lg opacity-60 hover:opacity-100 px-2" aria-label="收起">✕</button>
    </div>
    <!-- 碼錶 -->
    <div class="bg-black/80 rounded-md py-3 text-center font-mono text-3xl text-amber-300 tabular-nums mb-3">
      <span x-text="timeFormat"></span>
    </div>
    <!-- 控制 -->
    <div class="flex gap-2 mb-3">
      <button @click="toggleTimer()"
              class="flex-1 py-2.5 rounded text-sm font-bold active:scale-95"
              :class="running ? 'bg-orange-500 text-black' : 'bg-amber-500 text-black hover:bg-amber-400'">
        <span x-text="running ? '⏸ 暫停' : '▶ 開始'"></span>
      </button>
      <button @click="resetTimer()"
              class="flex-1 py-2.5 rounded text-sm font-bold bg-white/15 hover:bg-white/25 active:scale-95"
              :class="theme==='light' && '!bg-black/10 hover:!bg-black/20'">
        🔄 重設
      </button>
    </div>
    <!-- 鈴聲 -->
    <div class="border-t border-white/10 pt-3" :class="theme==='light' && '!border-black/10'">
      <div class="text-xs opacity-60 mb-2">手動鈴聲（依附件二/三規範）</div>
      <div class="grid grid-cols-3 gap-2">
        <button @click="bellShort()" class="py-2.5 px-1 text-xs font-bold rounded bg-green-700/70 hover:bg-green-600 text-white active:scale-95" title="下限時間到">🔔<br>短音</button>
        <button @click="bellLongShort()" class="py-2.5 px-1 text-xs font-bold rounded bg-red-700/70 hover:bg-red-600 text-white active:scale-95" title="上限時間到">🔔🔔<br>一短一長</button>
        <button @click="bellWarn()" class="py-2.5 px-1 text-xs font-bold rounded bg-yellow-600/80 hover:bg-yellow-500 text-black active:scale-95" title="30 秒警告">⏰<br>30 秒</button>
      </div>
      <p class="text-[10px] opacity-50 mt-2 leading-tight">演說 / 朗讀 / 情境式皆可用<br>單音 880Hz · 一短一長 880Hz</p>
    </div>
  </div>
</div>

<!-- 底部分段快速跳轉(手機加大按鈕 + safe-area) -->
<nav class="no-print fixed bottom-0 inset-x-0 z-20 bg-black/90 backdrop-blur border-t border-white/10 no-print-fullscreen" :class="theme==='light' && '!bg-white/95 !border-black/10'">
  <div class="bottom-nav max-w-5xl mx-auto px-3 py-2 flex items-center gap-2 justify-between">
    <button @click="prevPart()" :disabled="currentPartIdx <= 0"
            class="flex-1 max-w-[140px] h-10 min-h-[44px] rounded-sm border border-current opacity-80 hover:opacity-100 active:scale-95 disabled:opacity-30 text-sm font-bold flex items-center justify-center gap-1.5 transition">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      上一段
    </button>
    <div class="progress-indicator text-xs sm:text-sm opacity-70 text-center tabular-nums font-mono px-2">
      <span x-text="currentPartIdx + 1"></span> / <span x-text="currentScene ? currentScene.parts.length : 0"></span>
    </div>
    <button @click="nextPart()" :disabled="!currentScene || currentPartIdx >= currentScene.parts.length - 1"
            class="flex-1 max-w-[140px] h-10 min-h-[44px] rounded-sm border border-current opacity-80 hover:opacity-100 active:scale-95 disabled:opacity-30 text-sm font-bold flex items-center justify-center gap-1.5 transition">
      下一段
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</nav>

<script>
function prompter() {
  return {
    scripts: window.HOST_SCRIPTS || [],
    currentSceneNo: '1',
    currentPartIdx: 0,
    fontSize: 22,
    autoScroll: false,
    theme: 'dark',
    scrollSpeed: 30, // px/sec
    _scrollTimer: null,

    init() {
      // 從 URL hash 讀取場次:host.html#2-1
      const hash = location.hash.slice(1);
      if (hash && this.scripts.find(s => s.no === hash)) {
        this.currentSceneNo = hash;
      }
      // 手機自動使用較大預設字級(主持人在現場拿手機讀稿)
      const isMobile = window.innerWidth < 640;
      this.fontSize = isMobile ? 26 : 22;
      // 從 localStorage 讀取偏好(若使用者已調過,以使用者偏好為主)
      const prefs = JSON.parse(localStorage.getItem('prompter-prefs') || '{}');
      if (prefs.fontSize) this.fontSize = prefs.fontSize;
      if (prefs.theme) this.theme = prefs.theme;
      this.applyFontSize();
    },
    get currentScene() {
      return this.scripts.find(s => s.no === this.currentSceneNo);
    },
    resetView() {
      this.currentPartIdx = 0;
      this.autoScroll = false;
      this.stopAutoScroll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      location.hash = this.currentSceneNo;
    },
    applyFontSize() {
      document.documentElement.style.setProperty('--reader-size', this.fontSize + 'px');
    },
    savePrefs() {
      localStorage.setItem('prompter-prefs', JSON.stringify({ fontSize: this.fontSize, theme: this.theme }));
    },
    adjustSize(delta) {
      this.fontSize = Math.max(14, Math.min(56, this.fontSize + delta));
      this.applyFontSize();
      this.savePrefs();
    },
    cycleTheme() {
      const order = ['dark', 'amber', 'light'];
      this.theme = order[(order.indexOf(this.theme) + 1) % order.length];
      this.savePrefs();
    },
    toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    },
    nextPart() {
      if (!this.currentScene) return;
      if (this.currentPartIdx < this.currentScene.parts.length - 1) {
        this.currentPartIdx++;
        this.scrollToCurrent();
      }
    },
    prevPart() {
      if (this.currentPartIdx > 0) {
        this.currentPartIdx--;
        this.scrollToCurrent();
      }
    },
    scrollToCurrent() {
      this.$nextTick(() => {
        const el = document.querySelector(`[data-idx="${this.currentPartIdx}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    },
    toggleAutoScroll() {
      this.autoScroll = !this.autoScroll;
      if (this.autoScroll) this.startAutoScroll();
      else this.stopAutoScroll();
    },
    startAutoScroll() {
      const step = () => {
        window.scrollBy({ top: this.scrollSpeed / 30, behavior: 'auto' });
        const max = document.body.scrollHeight - window.innerHeight;
        if (window.scrollY >= max - 5) {
          this.autoScroll = false;
          this.stopAutoScroll();
          return;
        }
        this._scrollTimer = requestAnimationFrame(step);
      };
      this._scrollTimer = requestAnimationFrame(step);
    },
    stopAutoScroll() {
      if (this._scrollTimer) {
        cancelAnimationFrame(this._scrollTimer);
        this._scrollTimer = null;
      }
    },
    // 把文字內可能的時間、數字、強調點轉成顯眼樣式
    formatText(text) {
      const esc = String(text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return esc
        // 時間 08:30 / 08:38 強調
        .replace(/(\d{1,2}[：:]\d{2})/g, '<strong style="color:#fbbf24">$1</strong>')
        // 「1 號」「7 號」等強調
        .replace(/(\d+號)/g, '<strong style="color:#fbbf24">$1</strong>')
        // 列舉項目「一、」「二、」轉粗體
        .replace(/^([一二三四五六七八九十百]+、)/gm, '<strong style="color:#f87171">$1</strong>')
        // 星號開頭警示加紅色
        .replace(/^\*([^\n]+)/gm, '<span style="color:#f87171">★ $1</span>');
    }
  };
}

// 鍵盤快捷鍵
window.addEventListener('keydown', (e) => {
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
});

// 浮動計時 + 鈴聲面板(給計時組使用)
// 鈴聲規格依《附件二·演說》《附件三·情境式演說》:
//   下限到 → 短音(一聲)
//   上限到 → 一短一長
//   30 秒警告 → 短短音(自訂,給準備上臺者)
function bellTimer() {
  return {
    expanded: false,
    running: false,
    elapsed: 0, // 秒(小數)
    _interval: null,
    _audioCtx: null,
    _startAt: 0,
    theme: 'dark',
    init() {
      // 同步主題(讀 body class)
      const sync = () => { this.theme = document.body.classList.contains('theme-light') ? 'light' : 'dark'; };
      sync();
      const obs = new MutationObserver(sync);
      obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    },
    get timeFormat() {
      const totalMs = Math.floor(this.elapsed * 1000);
      const m = Math.floor(totalMs / 60000).toString().padStart(2, '0');
      const s = Math.floor((totalMs % 60000) / 1000).toString().padStart(2, '0');
      const cs = Math.floor((totalMs % 1000) / 10).toString().padStart(2, '0');
      return `${m}:${s}.${cs}`;
    },
    toggleTimer() {
      this.running = !this.running;
      if (this.running) {
        this._startAt = Date.now() - this.elapsed * 1000;
        this._interval = setInterval(() => {
          this.elapsed = (Date.now() - this._startAt) / 1000;
        }, 50);
        // 第一次按播放時,順便 unlock AudioContext(iOS Safari 必要)
        this._ensureCtx();
      } else {
        clearInterval(this._interval);
        this._interval = null;
      }
    },
    resetTimer() {
      this.running = false;
      this.elapsed = 0;
      if (this._interval) {
        clearInterval(this._interval);
        this._interval = null;
      }
    },
    _ensureCtx() {
      if (!this._audioCtx) {
        try {
          this._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return null; }
      }
      if (this._audioCtx.state === 'suspended') this._audioCtx.resume();
      return this._audioCtx;
    },
    _beep(freq, duration, volume) {
      const ctx = this._ensureCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(volume || 0.4, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    },
    bellShort() {
      // 下限時間到:短音
      this._beep(880, 0.35);
    },
    async bellLongShort() {
      // 上限時間到:一短一長
      this._beep(880, 0.3);
      await new Promise(r => setTimeout(r, 450));
      this._beep(880, 1.0);
    },
    bellWarn() {
      // 30 秒提醒:兩聲短促警告
      this._beep(660, 0.12);
      setTimeout(() => this._beep(660, 0.12), 180);
    },
  };
}
</script>
